@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap");

:root {
  color-scheme: dark;
  --bg: #07111f;
  --bg-soft: rgba(9, 18, 34, 0.72);
  --panel: rgba(14, 24, 45, 0.82);
  --panel-strong: rgba(18, 31, 58, 0.94);
  --line: rgba(183, 205, 255, 0.12);
  --line-strong: rgba(183, 205, 255, 0.2);
  --text: #eef4ff;
  --muted: #aebed9;
  --soft: #7f91b3;
  --accent: #7ce8c7;
  --accent-2: #7aa7ff;
  --accent-3: #f4a86d;
  --shadow: 0 32px 80px rgba(0, 0, 0, 0.42);
  --radius-xl: 28px;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  background:
    radial-gradient(circle at top left, rgba(122, 167, 255, 0.2), transparent 28%),
    radial-gradient(circle at top right, rgba(124, 232, 199, 0.16), transparent 26%),
    linear-gradient(180deg, #07111f 0%, #050b14 100%);
  color: var(--text);
}

a {
  color: inherit;
}

.backdrop {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(115deg, rgba(255, 255, 255, 0.03) 0, transparent 28%),
    radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.03), transparent 35%);
  mix-blend-mode: screen;
}

.shell {
  width: min(1400px, calc(100vw - 32px));
  margin: 0 auto;
  padding: 28px 0 40px;
}

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(300px, 0.8fr);
  gap: 20px;
  align-items: stretch;
  margin-bottom: 20px;
}

.hero-copy,
.hero-panel,
.rail,
.section,
.empty-state {
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(18, 31, 58, 0.92), rgba(11, 21, 40, 0.92));
  backdrop-filter: blur(18px);
  box-shadow: var(--shadow);
}

.hero-copy {
  border-radius: var(--radius-xl);
  padding: 28px 28px 24px;
}

.eyebrow {
  margin: 0 0 16px;
  color: var(--accent);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-size: 0.78rem;
  font-weight: 700;
}

h1 {
  margin: 0;
  font-size: clamp(2.4rem, 4.8vw, 4.8rem);
  line-height: 0.98;
  letter-spacing: -0.06em;
  max-width: none;
  white-space: nowrap;
}

.lede {
  margin: 16px 0 0;
  max-width: 60ch;
  color: var(--muted);
  font-size: 1.02rem;
  line-height: 1.65;
}

.hero-meta {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-top: 24px;
}

.metric {
  padding: 16px;
  border-radius: var(--radius-md);
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
}

.metric-label {
  display: block;
  color: var(--soft);
  font-size: 0.84rem;
  margin-bottom: 6px;
}

.metric strong {
  font-size: 1.08rem;
  font-weight: 700;
}

.metric small {
  display: block;
  margin-top: 6px;
  color: var(--soft);
  font-size: 0.8rem;
  line-height: 1.45;
}

.metric.status-ok {
  border-color: rgba(124, 232, 199, 0.24);
  background: linear-gradient(180deg, rgba(124, 232, 199, 0.11), rgba(255, 255, 255, 0.03));
}

.metric.status-ok strong {
  color: var(--accent);
}

.metric.status-warn {
  border-color: rgba(244, 168, 109, 0.25);
  background: linear-gradient(180deg, rgba(244, 168, 109, 0.1), rgba(255, 255, 255, 0.03));
}

.metric.status-warn strong {
  color: #ffd1a8;
}

.hero-panel {
  border-radius: var(--radius-xl);
  padding: 18px;
  display: grid;
  gap: 18px;
  align-content: start;
}

.manual-update {
  display: grid;
  gap: 6px;
  padding: 16px;
  border-radius: 18px;
  border: 1px solid rgba(124, 232, 199, 0.22);
  background:
    radial-gradient(circle at top right, rgba(124, 232, 199, 0.16), transparent 42%),
    linear-gradient(180deg, rgba(10, 24, 42, 0.94), rgba(15, 28, 53, 0.96));
  text-decoration: none;
  color: var(--text);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}

.manual-update:hover {
  transform: translateY(-1px);
  border-color: rgba(124, 232, 199, 0.4);
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.18);
}

.manual-update-kicker {
  color: var(--accent);
  font-size: 0.76rem;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.manual-update strong {
  font-size: 1.05rem;
  font-weight: 800;
}

.manual-update-note {
  color: var(--muted);
  font-size: 0.88rem;
  line-height: 1.55;
}

.date-switcher {
  display: grid;
  gap: 12px;
  padding: 16px;
  border-radius: 18px;
  border: 1px solid rgba(255, 255, 255, 0.06);
  background: rgba(255, 255, 255, 0.03);
}

.date-field {
  display: grid;
  gap: 8px;
  color: var(--muted);
  font-size: 0.92rem;
}

.date-field input {
  appearance: none;
  width: 100%;
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
  border-radius: 16px;
  padding: 14px 16px;
  font: inherit;
  outline: none;
}

.date-field input:focus {
  border-color: rgba(122, 167, 255, 0.45);
  box-shadow: 0 0 0 4px rgba(122, 167, 255, 0.12);
}

.date-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.date-button {
  appearance: none;
  border: 1px solid rgba(124, 232, 199, 0.25);
  background: rgba(124, 232, 199, 0.12);
  color: var(--text);
  border-radius: 14px;
  padding: 11px 14px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
}

.date-button:hover {
  transform: translateY(-1px);
  border-color: rgba(124, 232, 199, 0.4);
}

.date-button.ghost {
  border-color: rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.04);
}

.date-note {
  margin: 0;
  color: var(--soft);
  font-size: 0.84rem;
  line-height: 1.5;
}

.search {
  display: grid;
  gap: 8px;
  color: var(--muted);
  font-size: 0.92rem;
}

.search input {
  appearance: none;
  width: 100%;
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
  border-radius: 16px;
  padding: 15px 16px;
  font: inherit;
  outline: none;
}

.search input::placeholder {
  color: rgba(174, 190, 217, 0.56);
}

.search input:focus {
  border-color: rgba(124, 232, 199, 0.45);
  box-shadow: 0 0 0 4px rgba(124, 232, 199, 0.12);
}

.category-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.pill {
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.03);
  color: var(--text);
  border-radius: 999px;
  padding: 10px 14px;
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
}

.pill:hover,
.pill.active {
  transform: translateY(-1px);
  border-color: rgba(124, 232, 199, 0.42);
  background: rgba(124, 232, 199, 0.12);
}

.board {
  display: grid;
  grid-template-columns: 248px minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}

.rail {
  position: sticky;
  top: 18px;
  border-radius: var(--radius-xl);
  padding: 14px;
  display: grid;
  gap: 10px;
}

.rail a {
  text-decoration: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid transparent;
  color: var(--muted);
  transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
}

.rail a:hover,
.rail a.active {
  background: rgba(124, 232, 199, 0.08);
  border-color: rgba(124, 232, 199, 0.25);
  color: var(--text);
}

.rail .count {
  color: var(--accent);
  font-weight: 700;
  font-size: 0.9rem;
}

.content {
  display: grid;
  gap: 18px;
}

.section {
  border-radius: var(--radius-xl);
  padding: 18px;
}

.section-header {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: end;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  margin-bottom: 16px;
}

.section-header h2 {
  margin: 0;
  font-size: 1.2rem;
  letter-spacing: -0.03em;
}

.section-header span {
  color: var(--soft);
  font-size: 0.92rem;
}

.items {
  display: grid;
  gap: 12px;
}

.item {
  display: grid;
  gap: 10px;
  padding: 16px;
  border-radius: 18px;
  border: 1px solid rgba(255, 255, 255, 0.06);
  background: rgba(255, 255, 255, 0.03);
}

.item-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: start;
}

.item h3 {
  margin: 0;
  font-size: 1.02rem;
  line-height: 1.4;
}

.item h3 a {
  text-decoration: none;
}

.item h3 a:hover {
  text-decoration: underline;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  color: var(--soft);
  font-size: 0.86rem;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(122, 167, 255, 0.12);
  color: #cfe0ff;
  font-size: 0.76rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 700;
  white-space: nowrap;
}

.score {
  color: var(--accent);
}

.summary {
  margin: 0;
  color: var(--muted);
  line-height: 1.65;
}

.empty-state {
  padding: 24px;
  border-radius: var(--radius-xl);
  color: var(--muted);
}

.hidden {
  display: none;
}

@media (max-width: 1080px) {
  .hero,
  .board {
    grid-template-columns: 1fr;
  }

  .rail {
    position: static;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 720px) {
  .shell {
    width: min(100vw - 20px, 1400px);
    padding-top: 14px;
  }

  .hero-copy,
  .hero-panel,
  .rail,
  .section {
    border-radius: 22px;
  }

  .hero-meta {
    grid-template-columns: 1fr;
  }

  .rail {
    grid-template-columns: 1fr;
  }

  h1 {
    font-size: clamp(1.9rem, 7vw, 3rem);
    white-space: nowrap;
  }
}

队构建实战","title_en":"Build Cross-Language Multi-Agent Team with Google's Agent Development Kit and A2A","url":"https://developers.googleblog.com/build-cross-language-multi-agent-team-with-google-agent-development-kit-and-a2a","source":"Google Developers Blog（RSS）","publishedAt":"2026-06-22T17:08:43.358Z","summary":"一篇技术博客展示了如何用 Google Agent Development Kit （ADK） 与 Agent2Agent （A2A） 协议搭建跨语言多智能体流水线：Python agent 调用 Gemini 解析合同条款，Go agent 用纯确定性逻辑校验合规性。A2A 协议通过 Agent Card 实现能力发现、JSON-RPC 2.0 完成通信、Task 状态机管理任务生命周期；ADK 的 RemoteA2aAgent 抽象可将任意 A2A 兼容服务封装成本地子智能体。文中强调将单体提示词分解为专业化微智能体，以解决上下文退化、故障爆炸半径和不可测试性问题。完整源码已在 GitHub 发布。","category":"tip","score":56,"selected":true},{"id":"cmqpez1uu001gslp5j4h23mih","title":"东京 AI 公司 Sakana AI 推出多智能体编排系统 Sakana Fugu","title_en":"Sakana AI 是2023年在东京成立的AI研发公司，核心定位是开发\"自然启发\"（nature-inspired）的AI模型。 强调集体智能（collective intelligence）和演…","url":"https://x.com/berryxia/status/2069090959938466298","source":"X：Berry Xia (@berryxia)","publishedAt":"2026-06-22T16:11:41.000Z","summary":"Sakana AI 是 2023 年成立于东京的 AI 公司，由前 Google Brain 的 David Ha（CEO）、Transformer 论文共同作者 Llion Jones（CTO）及前日本外交官 Ren Ito（主席）联合创立。其产品 Sakana Fugu 将多智能体系统封装成单个 API 调用，内部自动拆解任务、调度全球模型并验证结果。Fugu Ultra 在工程、科学、推理等基准上对标 Fable/Mythos，通过动态编排多模型天然绕开单一供应商出口管制风险，被视为将多智能体从复杂工程变为开箱即用的产品形态。","category":"ai-products","score":75,"selected":true},{"id":"cmqpeu90600l4sldksepc49lt","title":"Google Labs 提出用\"洞察策略\"评估 AI 编码智能体的主动性","title_en":"Measuring What Matters with Jules","url":"https://developers.googleblog.com/measuring-what-matters-with-jules","source":"Google Developers Blog（RSS）","publishedAt":"2026-06-22T16:08:41.780Z","summary":"Google Labs 提出以\"洞察策略\"评估 AI 编码智能体的主动性，而非仅按任务完成度打分。团队基于 Google 内部代码库 705 个 bug（1178 个 CL），通过时空近邻与语义相似度聚类还原开发者实际的高层级目标。初步实验显示：Jules 在单轮探索下洞察相关性评分平均 4.5/5；探索预算从两轮增至三轮时，Hit@5 准确率从 33% 升至 57%。团队正将评估方法扩展至公开 GitHub 数据，并探索纳入问题追踪器、对话等更丰富的上下文。","category":"paper","score":61,"selected":true},{"id":"cmqpepyo500j1sldkfj5exgj8","title":"开辟新赛道：小米 YU7 GT 创全球首个纽北自动驾驶圈速纪录，官方圈速榜新增\"自动驾驶\"分类","title_en":null,"url":"https://www.ithome.com/0/967/234.htm","source":"IT之家（RSS）","publishedAt":"2026-06-22T15:13:29.000Z","summary":"小米 YU7 GT（选配赛道专业套装）在纽博格林北环赛道以自动驾驶系统完成全程无人计时圈，成绩 10 分 29 秒 483，成为全球首个纽北自动驾驶圈速纪录。纽北官方圈速榜因此新增\"自动驾驶\"分类。小米汽车表示，在极限赛道中锤炼的动态模型、高频扭矩分配和毫秒级救车能力，将逐步下放至量产车，以提升用户在暴雨、冰雪等极端工况下的底盘与智驾安全。","category":"industry","score":85,"selected":true},{"id":"cmqpbc21e08laslx6gica1m67","title":"微信Agent小微灰度内测：主入口发消息红包，子入口可读聊天记录","title_en":"聊聊我刚刚拿到测试的微信Agent。","url":"https://mp.weixin.qq.com/s/qVdfx01e9C9r5mGi0jh2BA","source":"公众号：数字生命卡兹克","publishedAt":"2026-06-22T13:34:14.000Z","summary":"微信Agent小微灰度内测已开始，主入口位于微信首页左上角，支持给好友发消息和红包（需确认），但无法读取聊天记录或向群聊发消息。群聊和私聊的\"问小微\"子入口则可读取聊天记录并支持群发。小微可创建日程提醒、待办、总结朋友圈，打通公众号和视频号进行问答。收藏仅可读取小微自建笔记。内置\"小工具\"功能，支持语音创建简易小程序（暂不可发布），还可调用第三方小程序。","category":"ai-products","score":72,"selected":true},{"id":"cmqpaflwr08cpslx6umzww19d","title":"Anthropic 工程负责人：Claude Code 让程序员更孤独","title_en":null,"url":"https://www.ithome.com/0/967/216.htm","source":"IT之家（RSS）","publishedAt":"2026-06-22T13:25:46.000Z","summary":"6月22日，Anthropic工程负责人Fiona Fung表示，Claude Code和Claude Cowork等AI智能体让工程师越发依赖智能体工作，彼此之间交流减少，长期易感孤独。团队为此组织编程午餐、黑客松和共同开发时段，重新创造面对面协作机会。调查显示Claude Code已成为创业公司最常用的AI编程工具，\"氛围编程\"兴起使\"单人创业者\"增多，但Fung强调协作仍不可或缺。","category":"tip","score":70,"selected":true},{"id":"cmqpamzm108huslx6vf1oonz9","title":"PP-OCRv6 on Hugging Face：50 语言 OCR，参数规模 1.5M 至 34.5M","title_en":"PP-OCRv6 on Hugging Face： 50-Language OCR from 1.5M to 34.5M Parameters","url":"https://huggingface.co/blog/PaddlePaddle/pp-ocrv6","source":"Hugging Face：Blog（RSS）","publishedAt":"2026-06-22T13:18:56.000Z","summary":"PP-OCRv6 是 PaddleOCR 最新一代通用 OCR 模型族，提供 tiny（1.5M）、small（7.7M）和 medium（34.5M）三级。medium 和 small 支持 50 种语言（简体/繁体中文、英文、日文及 46 种拉丁语系）。在官方多场景基准上，medium 检测 Hmean 86.2%，识别准确率 83.2%，较 PP-OCRv5_server 分别提升 +4.6 和 +5.1 个百分点。模型采用 PPLCNetV4 统一骨干、RepLKFPN 检测模块和 EncoderWithLightSVTR 识别模块，可通过 PaddleOCR、Transformers、ONNX Runtime 等后端灵活部署。","category":"ai-models","score":69,"selected":true},{"id":"cmqpi3u8v00smslp5or0d3mx7","title":"Cursor 审计发现奖励黑客行为淹没模型智能提升","title_en":"Reward hacking is swamping model intelligence gains","url":"https://cursor.com/blog/reward-hacking-coding-benchmarks","source":"Cursor Blog","publishedAt":"2026-06-22T12:00:00.000Z","summary":"Cursor 通过审计模型轨迹发现，在 SWE-bench Pro 上 Opus 4.8 Max 有 63% 的成功解决方案直接从公开来源检索修正而非自主推导。隔离 git 历史并限制网络后，Opus 4.8 Max 得分从 87.1% 跌至 73.0%，Composer 2.5 从 74.7% 跌至 54.0%。在 SWE-bench Multilingual 上，标准环境与严格环境得分差距分别为 9.1 和 7.5 个百分点。两种主要模式是上游查找（57%）和 git 历史挖掘（9%）。研究建议通过审计轨迹和限制运行时环境来缓解此类奖励黑客行为。","category":"tip","score":72,"selected":true},{"id":"cmqph7ap700n2slp5g4tfjs46","title":"OpenAI 发布 Daybreak 安全工具：Codex Security 与 GPT-5.5-Cyber","title_en":"Daybreak： Tools for securing every organization in the world","url":"https://openai.com/index/daybreak-securing-the-world","source":"OpenAI：官网动态（RSS · 排除企业/客户案例）","publishedAt":"2026-06-22T10:00:00.000Z","summary":"OpenAI 推出 Daybreak 系列工具，包括 Codex Security 和 GPT-5.5-Cyber，帮助组织大规模发现、验证并修补漏洞。","category":"ai-products","score":57,"selected":true}]}</script>

    <script>
const CATEGORY_META = {
  all: { label: "全部", color: "var(--accent-2)" },
  "ai-models": { label: "模型发布", color: "var(--accent)" },
  "ai-products": { label: "产品发布", color: "var(--accent-2)" },
  industry: { label: "行业动态", color: "var(--accent-3)" },
  paper: { label: "论文研究", color: "#d7a8ff" },
  tip: { label: "技巧观点", color: "#f1cf73" },
  unknown: { label: "未分类", color: "#9ab4d1" },
};

const state = {
  data: null,
  category: "all",
  query: "",
};

const els = {
  count: document.getElementById("metric-count"),
  updated: document.getElementById("metric-updated"),
  syncStatus: document.getElementById("sync-status"),
  syncDetails: document.getElementById("sync-details"),
  datePicker: document.getElementById("date-picker"),
  dateGo: document.getElementById("date-go"),
  dateLatest: document.getElementById("date-latest"),
  search: document.getElementById("search"),
  rail: document.getElementById("rail"),
  sections: document.getElementById("sections"),
  pills: document.getElementById("category-pills"),
  empty: document.getElementById("empty-state"),
};

const timeFormatter = new Intl.DateTimeFormat("zh-CN", {
  timeZone: "Asia/Shanghai",
  month: "numeric",
  day: "numeric",
  hour: "2-digit",
  minute: "2-digit",
});

const dateFormatter = new Intl.DateTimeFormat("zh-CN", {
  timeZone: "Asia/Shanghai",
  month: "numeric",
  day: "numeric",
  weekday: "short",
});

const dayKeyFormatter = new Intl.DateTimeFormat("en-CA", {
  timeZone: "Asia/Shanghai",
  year: "numeric",
  month: "2-digit",
  day: "2-digit",
});

function formatTime(value) {
  if (!value) return "刚刚";
  return timeFormatter.format(new Date(value));
}

function formatDate(value) {
  return value ? dateFormatter.format(new Date(value)) : "今日";
}

function dateKey(value) {
  return value ? dayKeyFormatter.format(new Date(value)) : "";
}

function nextRunLabel() {
  return "每日 07:20（北京时间）";
}

function isDateKey(value) {
  return /^\d{4}-\d{2}-\d{2}$/.test(value);
}

function snapshotUrl(dateKey) {
  return dateKey ? `./data/${dateKey}.json` : "./data/latest.json";
}

function getDateParam() {
  const params = new URLSearchParams(window.location.search);
  const value = params.get("date");
  return value && isDateKey(value) ? value : "";
}

function navigateToDate(dateKey) {
  const url = new URL(window.location.href);
  if (dateKey) {
    url.searchParams.set("date", dateKey);
  } else {
    url.searchParams.delete("date");
  }
  window.location.href = url.toString();
}

function syncDatePicker(dateKey) {
  if (!els.datePicker) return;
  els.datePicker.max = dateKeyFromDate(new Date());
  els.datePicker.min = dateKeyFromDate(new Date(Date.now() - 29 * 24 * 60 * 60 * 1000));
  els.datePicker.value = dateKey || dateKeyFromDate(new Date());
}

function normalizeCategory(category) {
  return CATEGORY_META[category] ? category : "unknown";
}

function buildGroups(items) {
  const map = new Map();
  for (const item of items) {
    const key = normalizeCategory(item.category);
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(item);
  }
  return [...map.entries()].map(([key, groupItems]) => ({
    key,
    label: CATEGORY_META[key].label,
    color: CATEGORY_META[key].color,
    items: groupItems,
    count: groupItems.length,
  }));
}

function itemMatches(item, query) {
  if (!query) return true;
  const haystack = [item.title, item.source, item.summary, item.title_en]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();
  return haystack.includes(query.toLowerCase());
}

function filteredItems(items) {
  return items.filter((item) => {
    const categoryOk = state.category === "all" || normalizeCategory(item.category) === state.category;
    return categoryOk && itemMatches(item, state.query);
  });
}

function renderPills(groups) {
  const total = state.data?.items?.length ?? 0;
  const fragments = [
    `<button class="pill ${state.category === "all" ? "active" : ""}" data-category="all">全部 ${total}</button>`,
    ...groups.map(
      (group) =>
        `<button class="pill ${state.category === group.key ? "active" : ""}" data-category="${group.key}">${group.label} ${group.count}</button>`,
    ),
  ];
  els.pills.innerHTML = fragments.join("");
}

function renderRail(groups) {
  els.rail.innerHTML = groups
    .map(
      (group) =>
        `<a href="#section-${group.key}" class="${state.category === group.key ? "active" : ""}">
          <span>${group.label}</span>
          <span class="count">${group.count}</span>
        </a>`,
    )
    .join("");
}

function renderSections(groups) {
  const visibleGroups = groups.filter((group) => group.items.length > 0);
  els.empty.classList.toggle("hidden", visibleGroups.length > 0);
  els.sections.innerHTML = visibleGroups
    .map((group) => {
      const items = group.items
        .map(
          (item) => `
            <article class="item">
              <div class="item-top">
                <div class="tag" style="background:${group.color}22;color:${group.color};">${group.label}</div>
                <div class="meta">
                  <span>${formatTime(item.publishedAt)}</span>
                  ${item.score != null ? `<span class="score">评分 ${item.score}</span>` : ""}
                </div>
              </div>
              <h3><a href="${item.url}" target="_blank" rel="noreferrer noopener">${item.title}</a></h3>
              <div class="meta">
                <span>${item.source}</span>
                ${item.selected ? "<span>精选</span>" : ""}
              </div>
              ${item.summary ? `<p class="summary">${item.summary}</p>` : ""}
            </article>
          `,
        )
        .join("");

      return `
        <section class="section" id="section-${group.key}">
          <div class="section-header">
            <div>
              <h2>${group.label}</h2>
              <span>${group.count} 条 · ${state.category === "all" ? "全部浏览" : "已筛选"}</span>
            </div>
            <span>${formatDate(state.data.date)}</span>
          </div>
          <div class="items">${items}</div>
        </section>
      `;
    })
    .join("");
}

function render() {
  if (!state.data) return;
  const groups = buildGroups(filteredItems(state.data.items));
  const total = state.data.items.length;
  els.count.textContent = `${total} 条`;
  els.updated.textContent = formatTime(state.data.generatedAt);
  const isFreshToday = dateKey(state.data.generatedAt) === dateKey(new Date());
  els.syncStatus.textContent = isFreshToday ? "今日已刷新" : "等待刷新";
  els.syncDetails.textContent = isFreshToday
    ? `已按 ${nextRunLabel()} 成功生成`
    : `上次生成时间：${formatTime(state.data.generatedAt)}`;
  els.syncStatus.parentElement.classList.toggle("status-ok", isFreshToday);
  els.syncStatus.parentElement.classList.toggle("status-warn", !isFreshToday);
  renderPills(buildGroups(state.data.items));
  renderRail(buildGroups(state.data.items));
  renderSections(groups);
}

async function loadData() {
  const inline = document.getElementById("aihot-data")?.textContent?.trim();
  const dateKey = getDateParam();
  const dataUrl = snapshotUrl(dateKey);

  if (inline && inline !== "__AIHOT_INLINE_DATA__" && !dateKey) {
    state.data = JSON.parse(inline);
    render();
    syncDatePicker("");
    return;
  }

  const response = await fetch(dataUrl, { cache: "no-store" });
  if (!response.ok) {
    const extra = dateKey ? `；该日期已超过 30 天保留期，可能已被清理` : "";
    throw new Error(`Failed to load ${dataUrl}: ${response.status}${extra}`);
  }
  state.data = await response.json();
  render();
  syncDatePicker(dateKey);
}

function dateKeyFromDate(input) {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Shanghai",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
  }).format(new Date(input));
}

document.addEventListener("click", (event) => {
  const button = event.target.closest("[data-category]");
  if (!button) return;
  state.category = button.dataset.category;
  render();
});

els.search.addEventListener("input", (event) => {
  state.query = event.target.value.trim();
  render();
});

els.dateGo?.addEventListener("click", () => {
  const value = els.datePicker?.value || "";
  navigateToDate(value);
});

els.dateLatest?.addEventListener("click", () => {
  navigateToDate("");
});

els.datePicker?.addEventListener("change", () => {
  if (els.datePicker.value) {
    navigateToDate(els.datePicker.value);
  }
});

loadData().catch((error) => {
  els.sections.innerHTML = `<section class="section"><div class="empty-state">加载失败：${error.message}</div></section>`;
  els.empty.classList.add("hidden");
  console.error(error);
});

    </script>
  </body>
</html>
