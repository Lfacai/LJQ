@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap");

:root {
  color-scheme: dark;
  --bg: #07111f;
  --bg-soft: rgba(9, 18, 34, 0.72);
  --panel: rgba(14, 24, 45, 0.82);
  --panel-strong: rgba(18, 31, 58, 0.94);
  --line: rgba(183, 205, 255, 0.12);
  --line-strong: rgba(183, 205, 255, 0.2);
  --text: #eef4ff;
  --muted: #aebed9;
  --soft: #7f91b3;
  --accent: #7ce8c7;
  --accent-2: #7aa7ff;
  --accent-3: #f4a86d;
  --shadow: 0 32px 80px rgba(0, 0, 0, 0.42);
  --radius-xl: 28px;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
}

* {

}

html {

}

body {

  min-height: 100vh;

}

a {
  color: inherit;
}

.backdrop {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:

.hero-copy,
.hero-panel,
.rail,
.section,
.empty-state {

.rail .count {
  color: var(--accent);
  font-weight: 700;
  font-size: 0.9rem;
}

.content {
  display: grid;
  gap: 18px;
}

.section {
  border-radius: var(--radius-xl);
  padding: 18px;
}

.section-header {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: end;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  margin-bottom: 16px;

.section-header h2 {

  font-size: 1.2rem;
  letter-spacing: -0.03em;

.section-header span {
  color: var(--soft);

}

.items {
  display: grid;
  gap: 12px;
}

.item {
  display: grid;
  gap: 10px;
  padding: 16px;
  border-radius: 18px;
  border: 1px solid rgba(255, 255, 255, 0.06);
  background: rgba(255, 255, 255, 0.03);
}

.item-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: start;
}

.item h3 {
  margin: 0;
  font-size: 1.02rem;
  line-height: 1.4;
}

.item h3 a {
  text-decoration: none;
}

.item h3 a:hover {
  text-decoration: underline;
}

.meta {
  display: flex;

  gap: 8px;
  color: var(--soft);
  font-size: 0.86rem;

.summary {

  color: var(--muted);
  line-height: 1.65;
}

.empty-state {

  border-radius: var(--radius-xl);
  color: var(--muted);
}

.hidden {
  display: none;
}

    grid-template-columns: 1fr;

  .rail {

ource":"TechCrunch：AI（RSS）","publishedAt":"2026-06-17T16:30:09.000Z","summary":"Google推出首款专为Gemini打造的智能音箱Google Home Speaker，售价99.99美元。支持自然语言请求和多步指令，可在说话中途纠正，并具备连续对话功能。内置10种新声音。高级AI功能需订阅Google Home Premium（月费10美元或年费100美元），包括Gemini Live自由对话、Nest摄像头活动摘要等。即日起预售，本月发货。","category":"ai-products","score":76,"selected":true},{"id":"cmqi8ygw106qpslf0farqmsq7","title":"Omnigent开源：AI智能体团队元框架","title_en":"The future of coding is not one agent. It's a whole AI team. Omnigent lets you run a team of agents…","url":"https://x.com/Yuchenj_UW/status/2067273020352380950","source":"X：Yuchen Jin (@Yuchenj_UW)","publishedAt":"2026-06-17T15:47:50.000Z","summary":"编程的未来不是单一智能体，而是一个完整的AI团队。\n\nOmnigent让你在一个实时会话中运行一个智能体团队：Claude Code、Codex、Cursor、Pi，以及你自己的智能体。\n\n它是一个面向AI智能体的元框架，基于我们内部的Databricks开发工具构建，现已开源给所有人。\n\n由传奇人物@matei_zaharia和Databricks AI团队打造。没错，Matei仍然编写大量代码，包括Omnigent和我们产品的前端代码。","category":"ai-products","score":77,"selected":true},{"id":"cmqi5ccyf05roslf0im5doz7q","title":"Cloudflare 发布 Cloudflare One stack：智能体驱动的部署工具集","title_en":"Introducing the Cloudflare One stack： agent-powered deployment","url":"https://blog.cloudflare.com/cloudflare-one-stack","source":"Cloudflare Blog","publishedAt":"2026-06-17T13:00:00.000Z","summary":"6月17日，Cloudflare 推出 Cloudflare One stack，一组可直接赋予 AI 智能体的技能文件，用于自动配置、部署和管理 Zero Trust 环境。工具集包含两个轻量级 skill：`cloudflare-one` 负责通用产品指导（VPN 替换、网络连接、安全策略等），`cloudflare-one-migration` 提供从 Zscaler、Palo Alto Networks 等厂商迁移的明确引导。技能内置决策树与结构化知识，智能体可自动执行云环境评估、网络拓扑生成及 Digital Experience Monitoring 排障。该 stack 基于 Cloudflare 员工数万小时客户经验提炼，降低学习与迁移门槛。","category":"ai-products","score":61,"selected":true},{"id":"cmqi35lls055sslf0uz3vsg07","title":"阿里云发布HappyOyster 1.0：一句话生成可实时交互的数字世界","title_en":"阿里发布世界模型 HappyOyster 快乐生蚝 1.0：一句话生成可实时交互的数字世界","url":"https://www.ithome.com/0/965/652.htm","source":"IT之家（RSS）","publishedAt":"2026-06-17T12:46:59.000Z","summary":"6月17日，阿里云发布开放式世界模型HappyOyster 1.0（快乐生蚝）。该产品基于原生多模态架构，支持多模态输入与音视频联合生成，可在生成过程中持续接收用户指令并实时响应画面。它深度学习物理世界状态转移规律，保持人物和环境长程一致性。官网开放\"实时导演\"与\"世界探索\"两种玩法：前者可随时叫停改写故事、与虚拟男友实时互动等；后者支持自由漫游、滑板冲刺、翼装滑翔、骑马奔驰、攻击打怪等交互。该产品已于今年4月16日开放内测，即日起至7月17日官网不定期掉落体验积分。","category":"ai-products","score":74,"selected":true},{"id":"cmqhxv2m503qoslf0x9ls46ps","title":"Strands Robots SDK：用单一智能体打通 Hugging Face Hub 到物理机器人","title_en":"From the Hugging Face Hub to robot hardware with Strands Agents and LeRobot","url":"https://huggingface.co/blog/amazon/strands-lerobot-hub-to-hardware","source":"Hugging Face：Blog（RSS）","publishedAt":"2026-06-17T10:18:05.000Z","summary":"AWS（Apache 2.0）开源的 Strands Robots SDK 将 LeRobot 栈封装为 AgentTools，构建统一智能体。默认用 MuJoCo 模拟（无需硬件），mode=\"real\" 切换至真实机器人。可记录演示数据为 LeRobotDataset 并推送 Hugging Face Hub，运行 GR00T 或 LerobotLocal 策略推理，经 Zenoh mesh 广播命令到多台机器人。模拟与硬件代码完全一致，只需改一个关键字参数。示例可在笔记本（Python 3.12+，Linux/macOS）无硬件、无 GPU 运行。","category":"ai-products","score":66,"selected":true},{"id":"cmqhw4oqb039kslf0c4r3g3yd","title":"Kickart 3.0发布，让广告视频创作更精准高效","title_en":null,"url":"https://mp.weixin.qq.com/s/e6SOMeRbdMB_zATsNcYmUQ","source":"公众号：火山引擎","publishedAt":"2026-06-17T09:45:29.000Z","summary":"火山引擎一站式营销创作平台Kickart 3.0（原\"创作Agent\"）正式上线，升级为对话式视频生成模式，用户可通过多轮对话调整商品图、故事板等，用自然语言生成营销视频。新增\"爆款裂变\"能力，上传视频链接后自动拆解爆款逻辑并重构至新商品视频，支持抖音电商内容合规与质量预审核。平台开放SaaS、API及Skill等多种交付方式，并已接入Seedance 2.0 mini，助力降低广告营销成本。","category":"ai-products","score":63,"selected":true}]},{"key":"industry","label":"行业动态","count":6,"items":[{"id":"cmqit4gtr040zsl5wam5ck48b","title":"上交所发布指引：AI大模型企业可适用科创板第五套上市标准","title_en":"上交所：AI 大模型企业适用科创板第五套上市标准，在申报时至少有一个大模型产品已完成上线发布并实现规模化应用","url":"https://www.ithome.com/0/965/735.htm","source":"IT之家（RSS）","publishedAt":"2026-06-18T00:49:16.000Z","summary":"上海证券交易所6月17日发布指引，支持尚未形成稳定收入的优质人工智能大模型企业通过科创板第五套上市标准发行上市。申报企业需在行业地位、产业链优势、目标市场需求、研发进度及关键指标方面具备突出竞争力。指引明确，申报时至少有一个大模型产品已完成上线发布并实现规模化应用，以验证商业模式可行性。下一步，上交所将在中国证监会指导下推进符合标准的企业上市。","category":"industry","score":72,"selected":true},{"id":"cmqirdp5603n0sl5wjfnes2e3","title":"Noam Shazeer 离开 Google 加入 OpenAI","title_en":"Noam Shazeer， the AI legend Google paid cpfh1hv","title":"谷歌发布Agentic Resource Discovery（ARD）开放规范","title_en":"Announcing the Agentic Resource Discovery specification","url":"https://developers.googleblog.com/announcing-the-agentic-resource-discovery-specification","source":"Google Developers Blog（RSS）","publishedAt":"2026-06-17T16:08:36.794Z","summary":"Agentic Resource Discovery（ARD）是一项开放规范，用于在Web上发布、发现和验证AI工具、技能与智能体。它基于两个原语：组织在其自有域名下托管catalog描述可用能力，registry作为搜索引擎索引catalog并响应发现请求。ARD支持加密验证，使客户端与端点连接前确认发布者身份，然后直接通过原生协议调用能力。Google Cloud的Gemini Enterprise Agent Platform通过Agent Registry提供企业级支持，包括URN命名、出站策略、工具固定和基于Agent Identity的信任验证。该规范现已发布，开发者可通过托管`ai-catalog.json`文件使其服务可发现。","category":"industry","score":63,"selected":true}]},{"key":"paper","label":"论文研究","count":3,"items":[{"id":"cmqiddvsx07xcslf0wcefjhm6","title":"用SGLang-JAX在TPU上优化Ling-2.6-1T：一个Pallas核将MoE数据移动隐藏在计算中","title_en":"Blog Optimizing Ling-2.6-1T on TPU with SGLang-JAX： Hiding MoE Data Movement Behind Compute with One Pallas Kernel SGLang-JAX now supports efficient serving of inclusionAI's Ling-2.6-1T on TPU v7x. With a working baseline in place， profiling pointed to the Mixture-of-Experts （MoE） path as the main bottleneck： each… Prayer， JamesBrianD， Haolin Fu， Haoguang Cai， Qinghan Chen","url":"https://www.lmsys.org/blog/2026-06-17-ling-2-6-tpu","source":"LMSYS：Blog（Chatbot Arena 团队）","publishedAt":"2026-06-17T17:53:38.527Z","summary":"SGLang-JAX现已支持inclusionAI的Ling-2.6-1T（1T稀疏MoE，63B激活参数，256路由专家，top-8路由加共享专家）在TPU v7x上高效推理。团队开发了Fused MoE V2--一个融合scatter、专家FFN和gather的Pallas核，通过将MoE数据移动隐藏在计算中，使MoE预填充延迟从5.16ms降至2.42ms（降幅53%），解码核延迟从0.249ms降至0.211ms（降幅约15%）。仅替换MoE核即提升预填充吞吐量24.8%，解码吞吐量18.5%-35.3%。在SGLang解码基准测试中，16块TPU v7x芯片输出吞吐量达16块H200 GPU的1.29倍（mc=128）至1.77倍（mc=512）。完整上线还包含混合KV/循环内存池、GLA线性注意力和单控制器数据并行支持。","category":"paper","score":69,"selected":true},{"id":"cmqiakygm075xslf0a7v3eqfl","title":"NVIDIA GEAR实验室发布ENPIRE：8个Codex智能体自主控制机器人完成物理实验","title_en":"I made Physical AutoResearch sound simple （conceptually）， but it took a village to pull off and lots…","url":"https://x.com/DrJimFan/status/2067283904986517866","source":"X：Jim Fan (@DrJimFan)","publishedAt":"2026-06-17T16:31:05.000Z","summary":"NVIDIA GEAR实验室推出ENPIRE系统，首次实现物理世界自主研究。系统让8个Codex智能体控制8台机器人，配备GPU和token预算。安全方面采用硬运动极限切断和扭矩受限夹爪两层硬件保障，支持通宵无人运行。奖励函数通过视觉分类器离线固定并冻结，防止智能体作弊。实时监测机器人利用率（MRU）、token利用率（MTU）和GPU利用率，以Tokens-to-Success和Time-to-Success评估效率。ENPIRE自主完成扎带、整理细针、安装GPU等高精度任务，发现8机器人并行探索显著更快。系统将开源。","category":"paper","score":81,"selected":true},{"id":"cmqi8ca6w06k1slf0tgau5lib","title":"Google 医学推理 AI 系统 AMIE 新研究：从诊断迈向长期疾病管理","title_en":"New research shows how AMIE， our medical AI， could help manage health conditions.","url":"https://blog.google/innovation-and-ai/models-and-research/google-research/amie-for-disease-management-in-nature","source":"Google Blog：AI（RSS）","publishedAt":"2026-06-17T15:00:00.000Z","summary":"今日发表在《自然》杂志上的研究展示了 Google 的医学推理 AI 系统 AMIE（Articulate Medical Intelligence Explorer）从单次诊断对话演进到长期疾病管理的能力。AMIE 利用 Gemini 模型的长上下文能力，整合共情对话智能体和深度思考管理推理智能体，可交叉引用数百页临床指南。在盲测中，AMIE 与 21 名初级保健医生相比，在整体管理推理上匹配临床医生，在计划精确性和指南一致性上得分显著更高。","category":"paper","score":55,"selected":true}]},{"key":"tip","label":"技巧观点","count":2,"items":[{"id":"cmqikjgrp01sesl5wptxhpc6s","title":"Google 分享 A2UI 与 MCP Apps 三种集成架构模式","title_en":"A2UI + MCP Apps： Combining the best of declarative and custom agentic UIs","url":"https://developers.googleblog.com/a2ui-and-mcp-apps","source":"Google Developers Blog（RSS）","publishedAt":"2026-06-17T21:13:53.385Z","summary":"Google 分享了三种集成 A2UI 与 MCP Apps 的架构模式，旨在结合两者优势。A2UI 采用声明式框架，通过 JSON payload 定义 UI，由宿主原生渲染，确保一致性与安全性，但受限于预定义组件库。MCP Apps 在 iframe 中使用标准 Web 技术提供自定义界面，但存在设计碎片化、性能与安全挑战。三种模式包括：通过 MCP 服务器提供 A2UI，利用 MCP Resources 或 Tool 调用传递 JSON，实现\"一次编写，原生渲染\"的跨平台能力；以及静态与动态交付方案。Google 正考虑扩展 MCP 以原生支持 A2UI。","category":"tip","score":64,"selected":true},{"id":"cmqiie2vh018hsl5wbdaj9mz3","title":"Matt Pocock 开源 skills v1：将技能描述 Token 成本降低 63%","title_en":"被 vibe coding 反噬过的AI玩家和开发者们看过来，这个工具包把 Token 消耗砍掉了 63%，注意可不是单纯的砍功能，主要是砍废话。 @mattpocockuk Pocock（Tota…","url":"https://x.com/AYi_AInotes/status/2067327021005656135","source":"X：阿易 AI Notes (@AYi_AInotes)","publishedAt":"2026-06-17T19:22:25.000Z","summary":"Matt Pocock（Total TypeScript 作者）开源了 skills v1，将技能描述的 Token 成本降低 63%。该工具包将技能分为模型可调用和用户可调用，新增 /codebase-design、/domain-modeling、/grilling 三项技能；重写 /writing-great-skills；将 /diagnose 更新为 /diagnosing-bugs 并改为模型可调用；新增 /ask-matt 路由技能，帮助 AI 自动判断时机触发合适工程流程。主推文评价其将 prompt 从咒语拆解为纪律性流程。","category":"tip","score":76,"selected":true}]}],"items":[{"id":"cmqj36zhf06vksl5w4wx2c0eo","title":"MOSS-TTS-Local-Transformer-v1.5 在 SGLang-Omni 上：原生流式 48 kHz 语音服务","title_en":"Blog MOSS-TTS Local Transformer v1.5 on SGLang-Omni： Serving Native-Streaming 48 kHz Speech Today we are announcing end-to-end serving for MOSS-TTS-Local-Transformer-v1.5 on SGLang-Omni， together with MOSI and the OpenMOSS Team. MOSS-TTS-Local-Transformer-v1.5 is an open TTS model for 48 kH… MOSI， OpenMOSS Team & SGLang-Omni Team","url":"https://www.lmsys.org/blog/2026-06-17-moss-tts-local-v15","source":"LMSYS：Blog（Chatbot Arena 团队）","publishedAt":"2026-06-18T05:56:08.548Z","summary":"MOSS-TTS-Local-Transformer-v1.5 是一款开源 TTS 模型，支持 48 kHz 立体声、零样本声音克隆、最长 10 分钟长文本合成、时长控制及 31 种语言。其核心采用 Qwen3-4B 骨干与约 2B 参数的 MOSS-Audio-Tokenizer-v2 音频编解码器，通过 12 个 RVQ 码本运行。SGLang-Omni 以三阶段流水线部署该模型。在 Seed-TTS-Eval 上词错误率 5.10%、语音相似度 69.23%，CV3-Eval 上 WER 7.48%、SIM 61.59%，MiniMax Multilingual 上 WER 6.37%、SIM 75.31%，X Voice 上 WER 20.48%、SIM 63.00%。","category":"ai-products","score":67,"selected":true},{"id":"cmqixf0ar057msl5w132f09uc","title":"cuTile Rust：安全无数据竞争的 GPU 内核系统","title_en":"Show HN： cuTile Rust：用 Rust 编写的、安全且无数据竞争的 GPU 内核","url":"https://github.com/nvlabs/cutile-rs","source":"Hacker News 热门（buzzing.cc 中文翻译）","publishedAt":"2026-06-18T03:09:11.275Z","summary":"cuTile Rust 是一个基于 tile 的 GPU 编程系统，允许用 Rust 编写内存安全、无数据竞争的内核。它通过 `#【cutile：：module】` 宏将内核 AST 嵌入主机二进制，在运行时经 CUDA Tile IR JIT 编译为 GPU cubin。可变张量在启动前分割，不可变张量共享，启动器在 GPU 工作期间保持所有权。在 NVIDIA B200 上，逐元素操作达 7 TB/s（约 91% 峰值带宽），GEMM 达 2 PFlop/s（约 92% 密集 f16 峰值）。基于 cuTile Rust 构建的 Grout 推理引擎在 RTX 5090 上解码 Qwen3-4B 达 171 tokens/s，在 B200 上解码 Qwen3-32B 达 82 tokens/s。项目处于早期研究阶段。","category":"ai-products","score":70,"selected":true},{"id":"cmqiw7jw604v7sl5w10zed5s8","title":"首个统一科学大模型 LOGOS 正式开源","title_en":null,"url":"https://mp.weixin.qq.com/s/50q5uY849FKnBzk1Q04MRg","source":"公众号：通义实验室（千问）","publishedAt":"2026-06-18T02:31:28.000Z","summary":"LOGOS 由 ATH-Token Foundry 联合中国人民大学高瓴人工智能学院开源，是首个基于统一\"科学语法\"的多领域科学生成基础模型。LOGOS-1B（1B参数）在六大科学任务上匹配或超越领域专用方法：口袋条件配体生成纯序列范式首次超越3D扩散模型，超越NatureLM（8×7B）；逆合成预测Top-1准确率74.8%；口袋位点识别仅靠序列达58.5% Top-n准确率；MOF材料生成NBB提升至17.78%。模型采用统一词汇表将蛋白质、小分子等编码为离散Token，通过空间交互离散化实现无需3D坐标的序列预测。预训练与下游任务形式与目标一致，跨领域知识迁移经实验验证有效。已完整开源模型权重、推理代码与技术报告。","category":"ai-models","score":75,"selected":true},{"id":"cmqiu8fi704ddsl5w9tfb6f52","title":"深入解析 Midjourney Scanner 技术内幕","title_en":"A technical dive inside our new \"Midjourney Scanner\"","url":"https://x.com/midjourney/status/2067422898407837797","source":"X：Midjourney (@midjourney)","publishedAt":"2026-06-18T01:43:24.000Z","summary":"我们全新\"Midjourney Scanner\"的技术深潜。","category":"ai-products","score":71,"selected":true},{"id":"cmqit4gtr040zsl5wam5ck48b","title":"上交所发布指引：AI大模型企业可适用科创板第五套上市标准","title_en":"上交所：AI 大模型企业适用科创板第五套上市标准，在申报时至少有一个大模型产品已完成上线发布并实现规模化应用","url":"https://www.ithome.com/0/965/735.htm","source":"IT之家（RSS）","publishedAt":"2026-06-18T00:49:16.000Z","summary":"上海证券交易所6月17日发布指引，支持尚未形成稳定收入的优质人工智能大模型企业通过科创板第五套上市标准发行上市。申报企业需在行业地位、产业链优势、目标市场需求、研发进度及关键指标方面具备突出竞争力。指引明确，申报时至少有一个大模型产品已完成上线发布并实现规模化应用，以验证商业模式可行性。下一步，上交所将在中国证监会指导下推进符合标准的企业上市。","category":"industry","score":72,"selected":true},{"id":"cmqit4gtr0410sl5w4ovwwmwa","title":"苹果 Xcode 27 核心首次深度集成 AI 智能体：支持自然语言修 Bug、构建 App","title_en":null,"url":"https://www.ithome.com/0/965/734.htm","source":"IT之家（RSS）","publishedAt":"2026-06-18T00:43:26.000Z","summary":"在 2026 年 WWDC 期间，苹果发布 Xcode 27，其核心组件首次整合 AI 智能体，能理解 Swift 语言并通过多轮自然语言对话辅助开发。AI 可跨多个文件修改整个代码库，也能根据提示与资源生成应用设计并独立构建完整应用 nfig key=value` 语法允许在提示中直接设置任意配置项，新增 `sandbox.allowAppleEvents` 选项使沙盒命令支持 Apple Events，新增 `CLAUDE_CLIENT_PRESENCE_FILE` 环境变量用于抑制移动端推送通知。内置 Bun 运行时升级至 1.4，改进了长段落流式输出（逐行显示）和 API 连接中断后自动重试。子 agent 面板优化：空闲 agent 30 秒自动隐藏、列表最多 5 行。修复了提示缓存读取、Write/Edit 在网络驱动器产生 0 字节文件、启动性能回归（约 120ms）、启动阻塞（最长 15 秒）、macOS TUI 冻结、子 agent 时长显示错误、API 重试指示器残留、AWS 凭证刷新等问题。","category":"ai-products","score":57,"selected":true},{"id":"cmqikjgrp01sesl5wptxhpc6s","title":"Google 分享 A2UI 与 MCP Apps 三种集成架构模式","title_en":"A2UI + MCP Apps： Combining the best of declarative and custom agentic UIs","url":"https://developers.googleblog.com/a2ui-and-mcp-apps","source":"Google Developers Blog（RSS）","publishedAt":"2026-06-17T21:13:53.385Z","summary":"Google 分享了三种集成 A2UI 与 MCP Apps 的架构模式，旨在结合两者优势。A2UI 采用声明式框架，通过 JSON payload 定义 UI，由宿主原生渲染，确保一致性与安全性，但受限于预定义组件库。MCP Apps 在 iframe 中使用标准 Web 技术提供自定义界面，但存在设计碎片化、性能与安全挑战。三种模式包括：通过 MCP 服务器提供 A2UI，利用 MCP Resources 或 Tool 调用传递 JSON，实现\"一次编写，原生渲染\"的跨平台能力；以及静态与动态交付方案。Google 正考虑扩展 MCP 以原生支持 A2UI。","category":"tip","score":64,"selected":true},{"id":"cmqijhrqi01iosl5wt876piz9","title":"借助 Workload Identity Federation 安全访问 Claude Platform","title_en":"Secure access to the Claude Platform with Workload Identity Federation","url":"https://claude.com/blog/workload-identity-federation","source":"Claude：Blog（网页）","publishedAt":"2026-06-17T20:44:36.833Z","summary":"Workload Identity Federation （WIF） 已在 Claude Platform 上全面可用。WIF 兼容任何 OIDC 身份提供者，覆盖所有 Claude API 端点（包括第一方 SDK 和 Claude Code）。WIF 用短生命期凭证替代静态 API 密钥，并引入服务账户，每个工作负载拥有独立身份、角色和审计日志。Claude Console 提供引导设置流程，支持 Admin API 进行组织管理。API 密钥可并行使用以便逐步迁移。","category":"ai-products","score":65,"selected":true},{"id":"cmqijhrqi01insl5wwxvq9xc6","title":"Claude Design 更新：跨项目保持品牌一致，与Claude Code协同","title_en":"Claude Design now stays on brand for daily work","url":"https://claude.com/blog/claude-design-stays-on-brand-for-daily-work","source":"Claude：Blog（网页）","publishedAt":"2026-06-17T20:44:36.833Z","summary":"6月17日，Claude Design 更新，支持跨项目使用统一设计 0gbt6hbe","title":"Anthropic与DeepMind CEO呼吁G7组建AI联盟排除中国","title_en":"We are entering a new era of the Cold War. Dario Amodei and Demis Hassabis are calling for a \"U.S.-…","url":"https://x.com/kimmonismus/status/2067310431669223425","source":"X：Kim (@kimmonismus)","publishedAt":"2026-06-17T18:16:30.000Z","summary":"Dario Amodei（Anthropic）与Demis Hassabis（Google DeepMind）在G7闭门会议上呼吁组建美国主导的联盟，为人工智能制定全球规则和标准。Amodei指出，该联盟应以前沿模型和硬件（包括芯片及其他关键组件）的访问权限为手段，将中国排除在外。这一主张被评论为高技术新冷战的开端，竞争方将从根本上被剥夺参与权。","category":"industry","score":79,"selected":true},{"id":"cmqiddvsx07xcslf0wcefjhm6","title":"用SGLang-JAX在TPU上优化Ling-2.6-1T：一个Pallas核将MoE数据移动隐藏在计算中","title_en":"Blog Optimizing Ling-2.6-1T on TPU with SGLang-JAX： Hiding MoE Data Movement Behind Compute with One Pallas Kernel SGLang-JAX now supports efficient serving of inclusionAI's Ling-2.6-1T on TPU v7x. With a working baseline in place， profiling pointed to the Mixture-of-Experts （MoE） path as the main bottleneck： each… Prayer， JamesBrianD， Haolin Fu， Haoguang Cai， Qinghan Chen","url":"https://www.lmsys.org/blog/2026-06-17-ling-2-6-tpu","source":"LMSYS：Blog（Chatbot Arena 团队）","publishedAt":"2026-06-17T17:53:38.527Z","summary":"SGLang-JAX现已支持inclusionAI的Ling-2.6-1T（1T稀疏MoE，63B激活参数，256路由专家，top-8路由加共享专家）在TPU v7x上高效推理。团队开发了Fused MoE V2--一个融合scatter、专家FFN和gather的Pallas核，通过将MoE数据移动隐藏在计算中，使MoE预填充延迟从5.16ms降至2.42ms（降幅53%），解码核延迟从0.249ms降至0.211ms（降幅约15%）。仅替换MoE核即提升预填充吞吐量24.8%，解码吞吐量18.5%-35.3%。在SGLang解码基准测试中，16块TPU v7x芯片输出吞吐量达16块H200 GPU的1.29倍（mc=128）至1.77倍（mc=512）。完整上线还包含混合KV/循环内存池、GLA线性注意力和单控制器数据并行支持。","category":"paper","score":69,"selected":true},{"id":"cmqics21707rbslf0ydj558jy","title":"Vercel 发布开源 AI 智能体框架 Eve：每个智能体就是一个文件目录","title_en":"Vercel Releases Eve： An Open-Source AI Agent Framework Where Each Agent is a Directory of Files Mapped to Capabilities","url":"https://www.marktechpost.com/2026/06/17/vercel-releases-eve","source":"MarkTechPost（RSS）","publishedAt":"2026-06-17T17:22:51.000Z","summary":"Vercel 发布开源 AI 智能体框架 Eve（npm 包，Apache-2.0 许可）。Eve 采用文件系统优先设计：每个智能体对应一个磁盘目录，目录结构直接映射模型、指令、工具、技能、连接、子智能体等能力，无需额外注册代码。内置六大生产级能力：持久执行（每步检查点，崩溃后可恢复）、沙箱计算、人机审批、安全连接（支持 MCP 和 OpenAPI）、多通道（Slack、Discord、Teams 等）以及追踪与评估（OpenTelemetry）。Vercel 内部运行了上百个智能体，包括数据分析工具 d0（月处理超3万查询）、自动销售代理 Lead Agent（年费约5000美元、回报32倍）和支持智能体 Vertex（自主解决92%工单）。","category":"ai-products","score":77,"selected":true},{"id":"cmqiakygm075xslf0a7v3eqfl","title":"NVIDIA GEAR实验室发布ENPIRE：8个Codex智能体自主控制机器人完成物理实验","title_en":"I made Physical AutoResearch sound simple （conceptually）， but it took a village to pull off and lots…","url":"https://x.com/DrJimFan/status/2067283904986517866","source":"X：Jim Fan (@DrJimFan)","publishedAt":"2026-06-17T16:31:05.000Z","summary":"NVIDIA GEAR实验室推出ENPIRE系统，首次实现物理世界自主研究。系统让8个Codex智能体控制8台机器人，配备GPU和token预算。安全方面采用硬运动极限切断和扭矩受限夹爪两层硬件保障，支持通宵无人运行。奖励函数通过视觉分类器离线固定并冻结，防止智能体作弊。实时监测机器人利用率（MRU）、token利用率（MTU）和GPU利用率，以Tokens-to-Success和Time-to-Success评估效率。ENPIRE自主完成扎带、整理细针、安装GPU等高精度任务，发现8机器人并行探索显著更快。系统将开源。","category":"paper","score":81,"selected":true},{"id":"cmqiah1xh073zslf07pwru4ui","title":"Google发布99美元Gemini智能音箱","title_en":"Google bets on Gemini to reinvent the smart home speaker","url":"https://techcrunch.com/2026/06/17/google-bets-on-gemini-to-reinvent-the-smart-home-speaker","source":"TechCrunch：AI（RSS）","publishedAt":"2026-06-17T16:30:09.000Z","summary":"Google推出首款专为Gemini打造的智能音箱Google Home Speaker，售价99.99美元。支持自然语言请求和多步指令，可在说话中途纠正，并具备连续对话功能。内置10种新声音。高级AI功能需订阅Google Home Premium（月费10美元或年费100美元），包括Gemini Live自由对话、Nest摄像头活动摘要等。即日起预售，本月发货。","category":"ai-products","score":76,"selected":true},{"id":"cmqi9mvca06wuslf0gcpfh1hv","title":"谷歌发布Agentic Resource Discovery（ARD）开放规范","title_en":"Announcing the Agentic Resource Discovery specification","url":"https://developers.googleblog.com/announcing-the-agentic-resource-discovery-specification","source":"Google Developers Blog（RSS）","publishedAt":"2026-06-17T16:08:36.794Z","summary":"Agentic Resource Discovery（ARD）是一项开放规范，用于在Web上发布、发现和验证AI工具、技能与智能体。它基于两个原语：组织在其自有域名下托管catalog描述 "category":"ai-products","score":66,"selected":true},{"id":"cmqhw4oqb039kslf0c4r3g3yd","title":"Kickart 3.0发布，让广告视频创作更精准高效","title_en":null,"url":"https://mp.weixin.qq.com/s/e6SOMeRbdMB_zATsNcYmUQ","source":"公众号：火山引擎","publishedAt":"2026-06-17T09:45:29.000Z","summary":"火山引擎一站式营销创作平台Kickart 3.0（原\"创作Agent\"）正式上线，升级为对话式视频生成模式，用户可通过多轮对话调整商品图、故事板等，用自然语言生成营销视频。新增\"爆款裂变\"能力，上传视频链接后自动拆解爆款逻辑并重构至新商品视频，支持抖音电商内容合规与质量预审核。平台开放SaaS、API及Skill等多种交付方式，并已接入Seedance 2.0 mini，助力降低广告营销成本。","category":"ai-products","score":63,"selected":true}]}</script>
    <main class="shell">
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">AI HOT · 每日 07:20 自动刷新</p>
          <h1>今日精选，按类别快速看完</h1>
          <p class="lede">把最近 24 小时内的精选 AI 日报收拢到一页，按模型、产品、行业、论文和技巧分类浏览。</p>
          <div class="hero-meta">
            <div class="metric">
              <span class="metric-label">本次收录</span>
              <strong id="metric-count">-</strong>
            </div>
            <div class="metric">
              <span class="metric-label">最后更新</span>
              <strong id="metric-updated">-</strong>
            </div>
            <div class="metric">
              <span class="metric-label">时间窗口</span>
              <strong>最近 24 小时</strong>
            </div>
          </div>
        </div>
        <aside class="hero-panel">
          <label class="search" for="search">
            <span>搜索标题 / 来源 / 摘要</span>
            <input id="search" type="search" placeholder="试试输入 OpenAI、模型、论文..." />
          </label>
          <div class="category-pills" id="category-pills"></div>
        </aside>
      </section>

      <section class="board">
        <nav class="rail" id="rail"></nav>
        <div class="content">
          <div id="empty-state" class="empty-state hidden">没有找到匹配的条目。</div>
          <div id="sections"></div>
        </div>
      </section>
    </main>
    <script>
const CATEGORY_META = {
  all: { label: "全部", color: "var(--accent-2)" },
  "ai-models": { label: "模型发布", color: "var(--accent)" },
  "ai-products": { label: "产品发布", color: "var(--accent-2)" },
  industry: { label: "行业动态", color: "var(--accent-3)" },
  paper: { label: "论文研究", color: "#d7a8ff" },
  tip: { label: "技巧观点", color: "#f1cf73" },
  unknown: { label: "未分类", color: "#9ab4d1" },
};

const state = {
  data: null,
  category: "all",
  query: "",
};

const els = {
  count: document.getElementById("metric-count"),
  updated: document.getElementById("metric-updated"),
  search: document.getElementById("search"),
  rail: document.getElementById("rail"),
  sections: document.getElementById("sections"),
  pills: document.getElementById("category-pills"),
  empty: document.getElementById("empty-state"),
};

const timeFormatter = new Intl.DateTimeFormat("zh-CN", {
  timeZone: "Asia/Shanghai",
  month: "numeric",
  day: "numeric",
  hour: "2-digit",
  minute: "2-digit",
});

const dateFormatter = new Intl.DateTimeFormat("zh-CN", {
  timeZone: "Asia/Shanghai",
  month: "numeric",
  day: "numeric",
  weekday: "short",
});

function formatTime(value) {
  if (!value) return "刚刚";
  return timeFormatter.format(new Date(value));
}

function formatDate(value) {
  return value ? dateFormatter.format(new Date(value)) : "今日";
}

function normalizeCategory(category) {
  return CATEGORY_META[category] ? category : "unknown";
}

function buildGroups(items) {
  const map = new Map();
  for (const item of items) {
    const key = normalizeCategory(item.category);
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(item);
  }
  return [...map.entries()].map(([key, groupItems]) => ({
    key,
    label: CATEGORY_META[key].label,
    color: CATEGORY_META[key].color,
    items: groupItems,
    count: groupItems.length,
  }));
}

function itemMatches(item, query) {
  if (!query) return true;
  const haystack = [item.title, item.source, item.summary, item.title_en]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();
  return haystack.includes(query.toLowerCase());
}

function filteredItems(items) {
  return items.filter((item) => {
    const categoryOk = state.category === "all" || normalizeCategory(item.category) === state.category;
    return categoryOk && itemMatches(item, state.query);
  });
}

function renderPills(groups) {
  const total = state.data?.items?.length ?? 0;
  const fragments = [
    `<button class="pill ${state.category === "all" ? "active" : ""}" data-category="all">全部 ${total}</button>`,
    ...groups.map(
      (group) =>
        `<button class="pill ${state.category === group.key ? "active" : ""}" data-category="${group.key}">${group.label} ${group.count}</button>`,
    ),
  ];
  els.pills.innerHTML = fragments.join("");
}

function renderRail(groups) {
  els.rail.innerHTML = groups
    .map(
      (group) =>
        `<a href="#section-${group.key}" class="${state.category === group.key ? "active" : ""}">
          <span>${group.label}</span>
          <span class="count">${group.count}</span>
        </a>`,
    )
    .join("");
}

function renderSections(groups) {
  const visibleGroups = groups.filter((group) => group.items.length > 0);
  els.empty.classList.toggle("hidden", visibleGroups.length > 0);
  els.sections.innerHTML = visibleGroups
    .map((group) => {
      const items = group.items
        .map(
          (item) => `
            <article class="item">
              <div class="item-top">
                <div class="tag" style="background:${group.color}22;color:${group.color};">${group.label}</div>
                <div class="meta">
                  <span>${formatTime(item.publishedAt)}</span>
                  ${item.score != null ? `<span class="score">评分 ${item.score}</span>` : ""}
                </div>
              </div>
              <h3><a href="${item.url}" target="_blank" rel="noreferrer noopener">${item.title}</a></h3>
              <div class="meta">
                <span>${item.source}</span>
                ${item.selected ? "<span>精选</span>" : ""}
              </div>
              ${item.summary ? `<p class="summary">${item.summary}</p>` : ""}
            </article>
          `,
        )
        .join("");

      return `
        <section class="section" id="section-${group.key}">
          <div class="section-header">
            <div>
              <h2>${group.label}</h2>
              <span>${group.count} 条 · ${state.category === "all" ? "全部浏览" : "已筛选"}</span>
            </div>
            <span>${formatDate(state.data.date)}</span>
          </div>
          <div class="items">${items}</div>
        </section>
      `;
    })
    .join("");
}

function render() {
  const groups = buildGroups(filteredItems(state.data.items));
  const total = state.data.items.length;
  els.count.textContent = `${total} 条`;
  els.updated.textContent = formatTime(state.data.generatedAt);
  renderPills(buildGroups(state.data.items));
  renderRail(buildGroups(state.data.items));
  renderSections(groups);
}

async function loadData() {
  const inline = document.getElementById("aihot-data")?.textContent?.trim();
  if (inline && inline !== "__AIHOT_INLINE_DATA__") {
    state.data = JSON.parse(inline);
    render();
    return;
  }

  const response = await fetch("./data.json", { cache: "no-store" });
  if (!response.ok) {
    throw new Error(`Failed to load data.json: ${response.status}`);
  }
  state.data = await response.json();
  render();
}

document.addEventListener("click", (event) => {
  const button = event.target.closest("[data-category]");
  if (!button) return;
  state.category = button.dataset.category;
  render();
});

els.search.addEventListener("input", (event) => {
  state.query = event.target.value.trim();
  render();
});

loadData().catch((error) => {
  els.sections.innerHTML = `<section class="section"><div class="empty-state">加载失败：${error.message}</div></section>`;
  els.empty.classList.add("hidden");
  console.error(error);
});

    </script>
  </body>
</html>
